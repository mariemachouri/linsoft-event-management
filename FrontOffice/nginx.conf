# Config nginx du FrontOffice
# - sert la SPA React (fallback index.html pour le routage côté client)
# - proxifie /api vers la gateway INTERNE → aucun problème de CORS
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Appels API → gateway (Service Kubernetes interne)
    location /api/ {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA : toute autre route renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
