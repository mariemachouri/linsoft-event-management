# ─────────────────────────────────────────────────────────────
# Build des 6 services restants (events, registrations, notifications,
# dashboard, charges, gateway) — source Git, stratégie Docker.
# Un ImageStream + un BuildConfig par service.
# ─────────────────────────────────────────────────────────────
# ===== events-service =====
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: { name: events-service, labels: { app: events-service, part-of: event-management } }
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: { name: events-service, labels: { app: events-service, part-of: event-management } }
spec:
  source:
    type: Git
    git: { uri: "https://github.com/mariemachouri/linsoft-event-management.git", ref: appmod/java-upgrade-20260211172141 }
  strategy:
    type: Docker
    dockerStrategy: { dockerfilePath: services/events-service/Dockerfile }
  output: { to: { kind: ImageStreamTag, name: "events-service:latest" } }
  resources:
    requests: { cpu: "200m", memory: 768Mi }
    limits: { cpu: "1", memory: 2Gi }
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2
---
