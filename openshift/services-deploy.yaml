  template:
    metadata: { labels: { app: notifications-service } }
    spec:
      containers:
        - name: notifications-service
          image: image-registry.openshift-image-registry.svc:5000/intern-machoury/notifications-service:latest
          ports: [{ containerPort: 8084 }]
          env:
            - { name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, value: "http://eureka-server:8761/eureka/" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:29092" }
