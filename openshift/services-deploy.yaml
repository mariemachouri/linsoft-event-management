            - { name: EMAIL_FROM, value: "achourimariem4@gmail.com" }
            - { name: EMAIL_TLS, value: "REQUIRED" }
            - { name: EMAIL_SSL, value: "false" }
            - { name: EMAIL_AUTH, value: "PLAIN LOGIN" }
            - { name: JAVA_TOOL_OPTIONS, value: "-Djava.net.preferIPv4Stack=true" }
            # SMS Africa's Talking (sandbox)
