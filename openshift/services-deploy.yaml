# ===== gateway-service (8080) — point d'entrée public =====
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway-service, labels: { app: gateway-service, part-of: event-management } }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway-service } }
  template:
    metadata: { labels: { app: gateway-service } }
    spec:
      containers:
        - name: gateway-service
          image: image-registry.openshift-image-registry.svc:5000/intern-machoury/gateway-service:latest
          ports: [{ containerPort: 8080 }]
          env:
            # Eureka désactivé : découverte par le DNS Kubernetes
            - { name: EUREKA_CLIENT_ENABLED, value: "false" }
            - { name: SPRING_CONFIG_IMPORT, value: "optional:configserver:http://config-server:8888" }
            # Sur OpenShift : routage par DNS Kubernetes (URLs directes) au lieu de lb:// (Eureka).
            # Remplace les routes de l'application.yml et désactive le discovery locator.
            - name: SPRING_APPLICATION_JSON
              value: '{"spring":{"cloud":{"gateway":{"discovery":{"locator":{"enabled":false}},"routes":[{"id":"auth-service","uri":"http://users-service:8083","predicates":["Path=/api/auth/**"]},{"id":"events-service","uri":"http://events-service:8081","predicates":["Path=/api/events/**"]},{"id":"registrations-service","uri":"http://registrations-service:8082","predicates":["Path=/api/registrations/**"]},{"id":"users-service","uri":"http://users-service:8083","predicates":["Path=/api/users/**"]},{"id":"notifications-service","uri":"http://notifications-service:8084","predicates":["Path=/api/notifications/**"]},{"id":"dashboard-service","uri":"http://dashboard-service:8085","predicates":["Path=/api/dashboard/**"]},{"id":"charges-service","uri":"http://charges-service:8086","predicates":["Path=/api/charges/**"]},{"id":"charge-predictions-service","uri":"http://charges-service:8086","predicates":["Path=/api/charge-predictions/**"]},{"id":"charge-catalog-service","uri":"http://charges-service:8086","predicates":["Path=/api/charge-catalog/**"]}]}}}}'
          resources:
            requests: { cpu: "100m", memory: 300Mi }
            limits: { cpu: "350m", memory: 600Mi }
          startupProbe: { tcpSocket: { port: 8080 }, failureThreshold: 40, periodSeconds: 10 }
          readinessProbe: { tcpSocket: { port: 8080 }, initialDelaySeconds: 15, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 8080 }, initialDelaySeconds: 90, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: gateway-service, labels: { app: gateway-service, part-of: event-management } }
spec:
  selector: { app: gateway-service }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: { name: gateway-service, labels: { app: gateway-service, part-of: event-management } }
spec:
  to: { kind: Service, name: gateway-service }
  port: { targetPort: 8080 }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
