# ─────────────────────────────────────────────────────────────
# Déploiement des 6 services restants.
# - URLs internes (mongodb, kafka, keycloak, eureka-server) identiques au docker-compose
# - OIDC issuer interne (keycloak:8080) pour dashboard & notifications
# - gateway : routes lb:// déjà dans son application.yml → juste l'URL Eureka + Route publique
# - CPU bas + startupProbe (tient dans le quota, survit au démarrage bridé)
# ─────────────────────────────────────────────────────────────
# ===== events-service (8081) =====
apiVersion: apps/v1
kind: Deployment
metadata: { name: events-service, labels: { app: events-service, part-of: event-management } }
spec:
  replicas: 1
  selector: { matchLabels: { app: events-service } }
  template:
    metadata: { labels: { app: events-service } }
    spec:
      containers:
        - name: events-service
          image: image-registry.openshift-image-registry.svc:5000/intern-machoury/events-service:latest
          ports: [{ containerPort: 8081 }]
          env:
            - { name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE, value: "http://eureka-server:8761/eureka/" }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:29092" }
            - { name: MONGODB_CONNECTION_STRING, value: "mongodb://admin:admin123@mongodb:27017/events_db?authSource=admin" }
          resources:
            requests: { cpu: "50m", memory: 256Mi }
            limits: { cpu: "200m", memory: 512Mi }
          startupProbe: { tcpSocket: { port: 8081 }, failureThreshold: 40, periodSeconds: 10 }
          readinessProbe: { tcpSocket: { port: 8081 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 8081 }, initialDelaySeconds: 60, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: events-service, labels: { app: events-service, part-of: event-management } }
spec:
  selector: { app: events-service }
  ports: [{ name: http, port: 8081, targetPort: 8081 }]
---
