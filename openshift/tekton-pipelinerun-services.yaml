# PipelineRun manuel — Services Backend (events + registrations)
#
# Déclencher avec :
#   oc create -f openshift/tekton-pipelinerun-services.yaml -n intern-machoury
#
# Suivre les logs :
#   tkn pipelinerun logs -f -n intern-machoury --last
# ou dans la console OpenShift : Pipelines → backend-pipeline → PipelineRuns
# ─────────────────────────────────────────────────────────────────────
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: backend-pipeline-run-
  namespace: intern-machoury
  labels:
    app: event-management
    triggered-by: manual
spec:
  pipelineRef:
    name: backend-pipeline
  serviceAccountName: pipeline-sa
  timeouts:
    pipeline: 75m
    task: 30m
  params:
    - name: SERVICES
      value: "events-service registrations-service"
