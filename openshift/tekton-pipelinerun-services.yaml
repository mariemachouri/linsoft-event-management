# PipelineRun manuel — Services Backend (events + registrations)
#
# Déclencher avec :
#   oc create -f openshift/tekton-pipelinerun-services.yaml -n intern-machoury
# ─────────────────────────────────────────────────────────────────────
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: backend-pipeline-run-
  namespace: intern-machoury
  labels:
    app: event-management
    triggered-by: manual
spec:
  pipelineRef:
    name: backend-pipeline
  taskRunTemplate:
    serviceAccountName: pipeline-sa
    podTemplate:
      initContainers:
        - name: prepare
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
        - name: place-scripts
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
  timeouts:
    pipeline: 75m
    task: 30m
  params:
    - name: SERVICES
      value: "events-service registrations-service"
