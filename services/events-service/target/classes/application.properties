quarkus.http.port=8081

# Body size limit for base64 images (10MB)
quarkus.http.limits.max-body-size=10M

# CORS Configuration for BackOffice access
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:4300
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://admin:admin123@127.0.0.1:27018/events_db?authSource=admin}
quarkus.mongodb.database=events_db
quarkus.mongodb.devservices.enabled=false

# ???????????????????????????????????????????????????????????????
# KEYCLOAK - D�SACTIV� POUR LES TESTS
# ???????????????????????????????????????????????????????????????
quarkus.oidc.enabled=false
quarkus.security.auth.enabled-in-dev-mode=false

