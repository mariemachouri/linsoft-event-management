quarkus.http.port=8084

# CORS Configuration for BackOffice access
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:4300
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://admin:admin123@localhost:27017/?authSource=admin}
quarkus.mongodb.database=notifications_db

quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180/realms/event-mgmt}
quarkus.oidc.client-id=notifications-service
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:change-me}
quarkus.oidc.application-type=service

# Temporarily disable authentication for testing
#quarkus.http.auth.permission.authenticated.paths=/api/*
#quarkus.http.auth.permission.authenticated.policy=authenticated

# OpenAPI / Swagger configuration
mp.openapi.extensions.smallrye.info.title=Notifications Service API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API for managing notifications (Email, SMS, Push)
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ===================================
# EMAIL CONFIGURATION (Quarkus Mailer)
# ===================================
# Email sender address
quarkus.mailer.from=${EMAIL_FROM:noreply@eventmanagement.com}

# SMTP Configuration - Gmail Example
quarkus.mailer.host=${EMAIL_HOST:mailhog}
quarkus.mailer.port=${EMAIL_PORT:1025}
quarkus.mailer.start-tls=${EMAIL_TLS:DISABLED}
quarkus.mailer.ssl=${EMAIL_SSL:false}
quarkus.mailer.username=${EMAIL_USERNAME:noreply@linsoft.tn}
quarkus.mailer.password=${EMAIL_PASSWORD:unused}
quarkus.mailer.auth-methods=${EMAIL_AUTH:PLAIN LOGIN}

# DISABLE mock mode - send real emails
quarkus.mailer.mock=false

# Enable detailed SMTP logging
quarkus.log.category."io.vertx.ext.mail".level=DEBUG
quarkus.log.category."org.eclipse.angus.mail".level=DEBUG

# ===================================
# SMS CONFIGURATION (Africa's Talking)
# ===================================
# Enable/disable SMS notifications
africastalking.enabled=${AT_ENABLED:false}

# Sandbox mode (true = test, false = production)
africastalking.sandbox=${AT_SANDBOX:true}

# Africa's Talking credentials
# Sandbox username is always "sandbox"
africastalking.username=${AT_USERNAME:sandbox}
africastalking.api.key=${AT_API_KEY:your-api-key}

# Optional: custom sender ID (omit to use default Africa's Talking number)
# africastalking.sender.id=${AT_SENDER_ID:EventMgmt}

# ???????????????????????????????????????????????????????????????
# KAFKA CONFIGURATION
# ???????????????????????????????????????????????????????????????
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Incoming channels (consumers)
mp.messaging.incoming.event-created.connector=smallrye-kafka
mp.messaging.incoming.event-created.topic=event.created
mp.messaging.incoming.event-created.value.deserializer=com.eventmgmt.notifications.dto.EventMessageDeserializer
mp.messaging.incoming.event-created.group.id=notifications-service-events

mp.messaging.incoming.registration-created.connector=smallrye-kafka
mp.messaging.incoming.registration-created.topic=registration.created
mp.messaging.incoming.registration-created.value.deserializer=com.eventmgmt.notifications.dto.RegistrationMessageDeserializer
mp.messaging.incoming.registration-created.group.id=notifications-service-registrations

mp.messaging.incoming.registration-confirmed.connector=smallrye-kafka
mp.messaging.incoming.registration-confirmed.topic=registration.confirmed
mp.messaging.incoming.registration-confirmed.value.deserializer=com.eventmgmt.notifications.dto.RegistrationMessageDeserializer
mp.messaging.incoming.registration-confirmed.group.id=notifications-service-registrations

mp.messaging.incoming.user-created.connector=smallrye-kafka
mp.messaging.incoming.user-created.topic=user.created
mp.messaging.incoming.user-created.value.deserializer=com.eventmgmt.notifications.dto.UserMessageDeserializer
mp.messaging.incoming.user-created.group.id=notifications-service-users

# ===================================
# PUSH NOTIFICATIONS (Firebase)
# ===================================
# Enable/disable push notifications
firebase.enabled=${FIREBASE_ENABLED:false}

# Path to Firebase credentials JSON file
# Download from Firebase Console > Project Settings > Service Accounts
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:config/firebase-credentials.json}

# ===================================
# SCHEDULER CONFIGURATION
# ===================================
# Enable scheduled task for processing pending notifications
quarkus.scheduler.enabled=true
