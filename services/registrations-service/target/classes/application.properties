#quarkus.http.auth.permission.authenticated.paths=/api/*
#quarkus.http.auth.permission.authenticated.policy=authenticated

# OpenAPI / Swagger configuration
mp.openapi.extensions.smallrye.info.title=Registrations Service API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API for managing event registrations
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ???????????????????????????????????????????????????????????????
# KAFKA CONFIGURATION
# ???????????????????????????????????????????????????????????????
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Outgoing channels (producer)
mp.messaging.outgoing.registration-created.connector=smallrye-kafka
mp.messaging.outgoing.registration-created.topic=registration.created
mp.messaging.outgoing.registration-created.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.outgoing.registration-confirmed.connector=smallrye-kafka
mp.messaging.outgoing.registration-confirmed.topic=registration.confirmed
mp.messaging.outgoing.registration-confirmed.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.outgoing.registration-cancelled.connector=smallrye-kafka
mp.messaging.outgoing.registration-cancelled.topic=registration.cancelled
mp.messaging.outgoing.registration-cancelled.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer