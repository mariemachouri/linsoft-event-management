quarkus.http.port=8085

# CORS Configuration for BackOffice access
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:4300
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

quarkus.mongodb.connection-string=${MONGODB_CONNECTION_STRING:mongodb://admin:admin123@localhost:27017/?authSource=admin}
quarkus.mongodb.database=dashboard_db

quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180/realms/event-mgmt}
quarkus.oidc.client-id=dashboard-service
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:change-me}
quarkus.oidc.application-type=service

# Temporarily disable authentication for testing
#quarkus.http.auth.permission.authenticated.paths=/api/*
#quarkus.http.auth.permission.authenticated.policy=authenticated

# OpenAPI / Swagger configuration
mp.openapi.extensions.smallrye.info.title=Dashboard Service API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API for managing dashboard snapshots
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ???????????????????????????????????????????????????????????????
# KAFKA CONFIGURATION
# ???????????????????????????????????????????????????????????????
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Incoming channels (consumers) - Dashboard aggregates data from all events
mp.messaging.incoming.event-created.connector=smallrye-kafka
mp.messaging.incoming.event-created.topic=event.created
mp.messaging.incoming.event-created.value.deserializer=com.eventmgmt.dashboard.kafka.deserializer.EventMessageDeserializer
mp.messaging.incoming.event-created.group.id=dashboard-service-events
mp.messaging.incoming.event-created.broadcast=true

mp.messaging.incoming.event-updated.connector=smallrye-kafka
mp.messaging.incoming.event-updated.topic=event.updated
mp.messaging.incoming.event-updated.value.deserializer=com.eventmgmt.dashboard.kafka.deserializer.EventMessageDeserializer
mp.messaging.incoming.event-updated.group.id=dashboard-service-events
mp.messaging.incoming.event-updated.broadcast=true

mp.messaging.incoming.registration-created.connector=smallrye-kafka
mp.messaging.incoming.registration-created.topic=registration.created
mp.messaging.incoming.registration-created.value.deserializer=com.eventmgmt.dashboard.kafka.deserializer.RegistrationMessageDeserializer
mp.messaging.incoming.registration-created.group.id=dashboard-service-registrations
mp.messaging.incoming.registration-created.broadcast=true

mp.messaging.incoming.user-created.connector=smallrye-kafka
mp.messaging.incoming.user-created.topic=user.created
mp.messaging.incoming.user-created.value.deserializer=com.eventmgmt.dashboard.kafka.deserializer.UserMessageDeserializer
mp.messaging.incoming.user-created.group.id=dashboard-service-users
mp.messaging.incoming.user-created.broadcast=true

# Additional topics for audit
mp.messaging.incoming.event-deleted.connector=smallrye-kafka
mp.messaging.incoming.event-deleted.topic=event.deleted
mp.messaging.incoming.event-deleted.value.deserializer=com.eventmgmt.dashboard.kafka.deserializer.EventMessageDeserializer
mp.messaging.incoming.event-deleted.group.id=dashboard-service-events

mp.messaging.incoming.registration-cancelled.connector=smallrye-kafka
mp.messaging.incoming.registration-cancelled.topic=registration.cancelled
mp.messaging.incoming.registration-cancelled.value.deserializer=com.eventmgmt.dashboard.kafka.deserializer.RegistrationMessageDeserializer
mp.messaging.incoming.registration-cancelled.group.id=dashboard-service-registrations

mp.messaging.incoming.user-updated.connector=smallrye-kafka
mp.messaging.incoming.user-updated.topic=user.updated
mp.messaging.incoming.user-updated.value.deserializer=com.eventmgmt.dashboard.kafka.deserializer.UserMessageDeserializer
mp.messaging.incoming.user-updated.group.id=dashboard-service-users

mp.messaging.incoming.user-deleted.connector=smallrye-kafka
mp.messaging.incoming.user-deleted.topic=user.deleted
mp.messaging.incoming.user-deleted.value.deserializer=com.eventmgmt.dashboard.kafka.deserializer.UserMessageDeserializer
mp.messaging.incoming.user-deleted.group.id=dashboard-service-users


