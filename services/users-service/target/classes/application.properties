quarkus.http.port=8083

# ???????????????????????????????????????????????????????????????
# CORS Configuration for BackOffice access
# ???????????????????????????????????????????????????????????????
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:4300
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# ???????????????????????????????????????????????????????????????
# MongoDB Configuration
# ???????????????????????????????????????????????????????????????
quarkus.mongodb.connection-string=mongodb://admin:admin123@localhost:27018/?authSource=admin
quarkus.mongodb.database=users_db

# ???????????????????????????????????????????????????????????????
# Keycloak OIDC Configuration
# ???????????????????????????????????????????????????????????????
quarkus.oidc.auth-server-url=http://localhost:8180/realms/event-mgmt
quarkus.oidc.client-id=users-service
quarkus.oidc.credentials.secret=your-secure-client-secret-change-in-production
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=http://localhost:8180/realms/event-mgmt
# Désactive l'auth proactive : les endpoints @PermitAll fonctionnent sans token ni Keycloak
quarkus.http.auth.proactive=false

# ???????????????????????????????????????????????????????????????
# Keycloak Admin Client Configuration
# ???????????????????????????????????????????????????????????????
keycloak.admin.url=http://localhost:8180
keycloak.realm=event-mgmt
keycloak.admin.realm=master
keycloak.admin.username=admin
keycloak.admin.password=admin
keycloak.admin.client-id=admin-cli

# ???????????????????????????????????????????????????????????????
# Security Configuration - Routes publiques pour les tests
# ???????????????????????????????????????????????????????????????
quarkus.http.auth.permission.public.paths=/api/*,/q/swagger-ui/*,/q/openapi,/q/health/*
quarkus.http.auth.permission.public.policy=permit

# ???????????????????????????????????????????????????????????????
# OpenAPI / Swagger Configuration
# ???????????????????????????????????????????????????????????????
mp.openapi.extensions.smallrye.info.title=Users Service API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API for managing users, authentication, and roles with Keycloak
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ???????????????????????????????????????????????????????????????
# Logging
# ???????????????????????????????????????????????????????????????
quarkus.log.level=INFO
quarkus.log.category."com.eventmgmt.users".level=DEBUG

# ???????????????????????????????????????????????????????????????
# KAFKA CONFIGURATION
# ???????????????????????????????????????????????????????????????
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Outgoing channels (producer)
mp.messaging.outgoing.user-created.connector=smallrye-kafka
mp.messaging.outgoing.user-created.topic=user.created
mp.messaging.outgoing.user-created.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.outgoing.user-updated.connector=smallrye-kafka
mp.messaging.outgoing.user-updated.topic=user.updated
mp.messaging.outgoing.user-updated.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

mp.messaging.outgoing.user-deleted.connector=smallrye-kafka
mp.messaging.outgoing.user-deleted.topic=user.deleted
mp.messaging.outgoing.user-deleted.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer