version: '3.8'

services:
  # Keycloak for Authentication & Authorization
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_HOSTNAME_URL=http://localhost:8180
      - KC_HOSTNAME_ADMIN_URL=http://localhost:8180
    command: start-dev
    volumes:
      - ./keycloak-theme/themes:/opt/keycloak/themes
    ports:
      - "8180:8080"
    depends_on:
      - keycloak-db
    networks:
      - eventmgmt-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # PostgreSQL for Keycloak
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    networks:
      - eventmgmt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for Users Service
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
      - MONGO_INITDB_DATABASE=users_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - eventmgmt-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - eventmgmt-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - eventmgmt-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Kafka UI for monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: event-mgmt-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - eventmgmt-network

  eureka-server:
    build:
      context: .
      dockerfile: ./services/eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - eventmgmt-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  config-server:
    build:
      context: .
      dockerfile: ./services/config-server/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - eventmgmt-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  gateway-service:
    build:
      context: .
      dockerfile: ./services/gateway-service/Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CODEC_MAX_IN_MEMORY_SIZE=10MB
      - SPRING_CLOUD_GATEWAY_ROUTES[0]_ID=auth-service
      - SPRING_CLOUD_GATEWAY_ROUTES[0]_URI=http://users-service:8083
      - SPRING_CLOUD_GATEWAY_ROUTES[0]_PREDICATES[0]=Path=/api/auth/**
      - SPRING_CLOUD_GATEWAY_ROUTES[1]_ID=events-service
      - SPRING_CLOUD_GATEWAY_ROUTES[1]_URI=http://events-service:8081
      - SPRING_CLOUD_GATEWAY_ROUTES[1]_PREDICATES[0]=Path=/api/events/**
      - SPRING_CLOUD_GATEWAY_ROUTES[2]_ID=registrations-service
      - SPRING_CLOUD_GATEWAY_ROUTES[2]_URI=http://registrations-service:8082
      - SPRING_CLOUD_GATEWAY_ROUTES[2]_PREDICATES[0]=Path=/api/registrations/**
      - SPRING_CLOUD_GATEWAY_ROUTES[3]_ID=users-service
      - SPRING_CLOUD_GATEWAY_ROUTES[3]_URI=http://users-service:8083
      - SPRING_CLOUD_GATEWAY_ROUTES[3]_PREDICATES[0]=Path=/api/users/**
      - SPRING_CLOUD_GATEWAY_ROUTES[4]_ID=notifications-service
      - SPRING_CLOUD_GATEWAY_ROUTES[4]_URI=http://notifications-service:8084
      - SPRING_CLOUD_GATEWAY_ROUTES[4]_PREDICATES[0]=Path=/api/notifications/**
      - SPRING_CLOUD_GATEWAY_ROUTES[5]_ID=dashboard-service
      - SPRING_CLOUD_GATEWAY_ROUTES[5]_URI=http://dashboard-service:8085
      - SPRING_CLOUD_GATEWAY_ROUTES[5]_PREDICATES[0]=Path=/api/dashboard/**
      - SPRING_CLOUD_GATEWAY_ROUTES[6]_ID=charges-service
      - SPRING_CLOUD_GATEWAY_ROUTES[6]_URI=http://charges-service:8086
      - SPRING_CLOUD_GATEWAY_ROUTES[6]_PREDICATES[0]=Path=/api/charges/**
      - SPRING_CLOUD_GATEWAY_ROUTES[7]_ID=charge-predictions-service
      - SPRING_CLOUD_GATEWAY_ROUTES[7]_URI=http://charges-service:8086
      - SPRING_CLOUD_GATEWAY_ROUTES[7]_PREDICATES[0]=Path=/api/charge-predictions/**
      - SPRING_CLOUD_GATEWAY_ROUTES[8]_ID=charge-catalog-service
      - SPRING_CLOUD_GATEWAY_ROUTES[8]_URI=http://charges-service:8086
      - SPRING_CLOUD_GATEWAY_ROUTES[8]_PREDICATES[0]=Path=/api/charge-catalog/**
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_started
    networks:
      - eventmgmt-network

  events-service:
    build:
      context: .
      dockerfile: ./services/events-service/Dockerfile
    container_name: events-service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MONGODB_CONNECTION_STRING=mongodb://admin:admin123@mongodb:27017/events_db?authSource=admin
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
      gateway-service:
        condition: service_started
    networks:
      - eventmgmt-network

  registrations-service:
    build:
      context: .
      dockerfile: ./services/registrations-service/Dockerfile
    container_name: registrations-service
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MONGODB_CONNECTION_STRING=mongodb://admin:admin123@mongodb:27017/registrations_db?authSource=admin
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
      gateway-service:
        condition: service_started
    networks:
      - eventmgmt-network

  users-service:
    build:
      context: .
      dockerfile: ./services/users-service/Dockerfile
    container_name: users-service
    ports:
      - "8083:8083"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - QUARKUS_MONGODB_CONNECTION_STRING=mongodb://admin:admin123@mongodb:27017/?authSource=admin
      - KEYCLOAK_URL=http://keycloak:8080/realms/event-mgmt
      - KEYCLOAK_ADMIN_URL=http://keycloak:8080
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KEYCLOAK_REALM=event-mgmt
      - KEYCLOAK_CLIENT_SECRET=users-service-secret
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      # Corriger l'URL OIDC pour Docker (localhost:8180 -> keycloak:8080 dans le réseau Docker)
      - QUARKUS_OIDC_AUTH_SERVER_URL=http://keycloak:8080/realms/event-mgmt
      - QUARKUS_OIDC_TOKEN_ISSUER=http://localhost:8180/realms/event-mgmt
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_started
      gateway-service:
        condition: service_started
    networks:
      - eventmgmt-network

  notifications-service:
    build:
      context: .
      dockerfile: ./services/notifications-service/Dockerfile
    container_name: notifications-service
    ports:
      - "8084:8084"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MONGODB_CONNECTION_STRING=mongodb://admin:admin123@mongodb:27017/notifications_db?authSource=admin
      - FIREBASE_ENABLED=true
      - FIREBASE_CREDENTIALS_PATH=config/firebase-credentials.json
      - KEYCLOAK_URL=http://keycloak:8080/realms/event-mgmt
      - QUARKUS_OIDC_TOKEN_ISSUER=http://localhost:8180/realms/event-mgmt
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USERNAME=achoury.mayem@gmail.com
      - EMAIL_PASSWORD=aghgcmbgaypmholy
      - EMAIL_FROM=achoury.mayem@gmail.com
      # Africa's Talking SMS
      - AT_ENABLED=true
      - AT_SANDBOX=true
      - AT_USERNAME=sandbox
      - AT_API_KEY=atsk_c28b5f1ff537e80ad0bf12394d8ad3f8fcff4ed80b43f1995b1b4e5492247a8e549b4fd9
      # AT_SENDER_ID=EventMgmt  # uncomment to set custom sender name
    volumes:
      - ./services/notifications-service/config:/app/config
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
      gateway-service:
        condition: service_started
    networks:
      - eventmgmt-network

  dashboard-service:
    build:
      context: .
      dockerfile: ./services/dashboard-service/Dockerfile
    container_name: dashboard-service
    ports:
      - "8085:8085"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MONGODB_CONNECTION_STRING=mongodb://admin:admin123@mongodb:27017/dashboard_db?authSource=admin
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_started
      gateway-service:
        condition: service_started
    networks:
      - eventmgmt-network

  charges-service:
    build:
      context: .
      dockerfile: ./services/charges-service/Dockerfile
    container_name: charges-service
    ports:
      - "8086:8086"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MONGODB_CONNECTION_STRING=mongodb://admin:admin123@mongodb:27017/charges_db?authSource=admin
    depends_on:
      - eureka-server
      - gateway-service
    networks:
      - eventmgmt-network

networks:
  eventmgmt-network:
    driver: bridge

volumes:
  keycloak_data:
    driver: local
  mongodb_data:
    driver: local
