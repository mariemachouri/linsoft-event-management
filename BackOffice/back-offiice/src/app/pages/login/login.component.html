<div class="login-page">

  <div class="login-card">

    <h2 class="card-title">Connexion</h2>

    <div class="field-group">
      <input
        type="email"
        class="field-input"
        placeholder="Entrez votre email"
        [(ngModel)]="email"
        [disabled]="isLoading"
      />
    </div>

    <div class="field-group">
      <input
        type="password"
        class="field-input"
        placeholder="Entrez votre mot de passe"
        [(ngModel)]="password"
        [disabled]="isLoading"
      />
    </div>

    <div class="form-options">
      <label class="remember-me">
        <input type="checkbox" [(ngModel)]="rememberMe" />
        <span>Se souvenir de moi</span>
      </label>
      <a class="forgot-link" (click)="forgotPassword()">Mot de passe oublié ?</a>
    </div>

    <button class="login-btn" (click)="login()" [disabled]="isLoading">
      <span *ngIf="!isLoading">Se connecter</span>
      <span *ngIf="isLoading" class="spinner-wrap">
        <span class="spinner"></span>
      </span>
    </button>

    <p class="register-hint">
      Pas encore de compte ?
      <a class="register-link" (click)="goToRegister()">S'inscrire</a>
    </p>

  </div>

</div>
