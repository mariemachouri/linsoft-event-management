<div class="login-container">
  <div class="login-wrapper">
    <!-- Branding -->
    <div class="login-branding">
      <div class="login-logo">
        <i class="tim-icons icon-calendar-60"></i>
      </div>
      <h1 class="login-title">Event Manager</h1>
      <p class="login-subtitle">Système de Gestion d'Événements</p>
    </div>

    <!-- Formulaire de Connexion -->
    <div class="login-card">
      <div class="form-title">
        <h2>Connexion</h2>
        <p>Connectez-vous avec vos identifiants</p>
      </div>

      <!-- Messages d'erreur -->
      <div *ngIf="error" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="tim-icons icon-simple-remove"></i>
        <span>{{ error }}</span>
        <button type="button" class="btn-close" (click)="error = ''"></button>
      </div>

      <!-- Formulaire -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Champ Username -->
        <div class="form-group">
          <label for="username" class="form-label">
            <i class="tim-icons icon-single-02"></i> Nom d'utilisateur
          </label>
          <input
            type="text"
            formControlName="username"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f['username'].errors }"
            id="username"
            placeholder="Entrez votre nom d'utilisateur"
          />
          <div *ngIf="submitted && f['username'].errors" class="invalid-feedback">
            <i class="tim-icons icon-simple-remove"></i>
            <span *ngIf="f['username'].errors['required']">Le nom d'utilisateur est requis</span>
          </div>
        </div>

        <!-- Champ Password -->
        <div class="form-group">
          <label for="password" class="form-label">
            <i class="tim-icons icon-lock-circle"></i> Mot de passe
          </label>
          <input
            type="password"
            formControlName="password"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f['password'].errors }"
            id="password"
            placeholder="Entrez votre mot de passe"
          />
          <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
            <i class="tim-icons icon-simple-remove"></i>
            <span *ngIf="f['password'].errors['required']">Le mot de passe est requis</span>
          </div>
        </div>

        <!-- Bouton Connexion -->
        <button
          type="submit"
          class="btn btn-primary w-100 login-btn"
          [disabled]="loading"
        >
          <span *ngIf="!loading" class="btn-content">
            <i class="tim-icons icon-key-25"></i>
            Se Connecter
          </span>
          <span *ngIf="loading" class="btn-content loading">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Connexion en cours...
          </span>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span>OU</span>
      </div>

      <!-- Liens Utiles -->
      <div class="login-footer">
        <a href="#" class="footer-link">
          <i class="tim-icons icon-lock-circle"></i>
          Mot de passe oublié?
        </a>
        <a href="#" class="footer-link">
          <i class="tim-icons icon-single-02"></i>
          Créer un compte
        </a>
      </div>
    </div>

    <!-- Footer -->
    <div class="login-footer-info">
      <p>© 2024 Event Manager. Tous droits réservés.</p>
    </div>
  </div>

  <!-- Décoration de background -->
  <div class="background-decoration">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>
</div>
