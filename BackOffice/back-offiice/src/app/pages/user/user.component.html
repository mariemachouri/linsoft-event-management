
<div class="content user-profile-container">
  <!-- En-tête -->
  <div class="profile-header mb-5">
    <h1 class="profile-title">⚙️ Edit My Profile</h1>
    <p class="profile-subtitle">Update your personal information</p>
  </div>

  <div class="row">
    <!-- Formulaire Profil -->
    <div class="col-lg-8">
      <div class="card profile-card">
        <div class="card-header">
          <h5 class="card-title">📝 Personal Information</h5>
          <p class="card-subtitle">Edit your personal details</p>
        </div>
        <div class="card-body">
          <form class="profile-form">
            <!-- Ligne 1: Company, Username, Email -->
            <div class="row">
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label">
                    <i class="tim-icons icon-briefcase-2"></i> Company
                  </label>
                  <input
                    class="form-control"
                    disabled
                    placeholder="Company"
                    type="text"
                    value="Creative Code Inc."
                  />
                  <small class="form-text-muted">Read only</small>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label">
                    <i class="tim-icons icon-single-02"></i> Username
                  </label>
                  <input
                    class="form-control"
                    placeholder="Username"
                    type="text"
                    value="michael23"
                  />
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label">
                    <i class="tim-icons icon-email-85"></i> Email
                  </label>
                  <input
                    class="form-control"
                    placeholder="Email"
                    type="email"
                    value="mike@email.com"
                  />
                </div>
              </div>
            </div>

            <!-- Ligne 2: Prénom et Nom -->
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label class="form-label">
                    <i class="tim-icons icon-single-copy-04"></i> First Name
                  </label>
                  <input
                    class="form-control"
                    placeholder="First Name"
                    type="text"
                    value="Mike"
                  />
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label class="form-label">
                    <i class="tim-icons icon-single-copy-04"></i> Last Name
                  </label>
                  <input
                    class="form-control"
                    placeholder="Last Name"
                    type="text"
                    value="Andrew"
                  />
                </div>
              </div>
            </div>

            <!-- Address -->
            <div class="form-group">
              <label class="form-label">
                <i class="tim-icons icon-pin"></i> Address
              </label>
              <input
                class="form-control"
                placeholder="Address"
                type="text"
                value="Bld Mihail Kogalniceanu, nr. 8 Bl 1, Sc 1, Ap 09"
              />
            </div>

            <!-- Ligne 3: Ville, Pays, Code Postal -->
            <div class="row">
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label">
                    <i class="tim-icons icon-pin"></i> Address
                  </label>
                  <input
                    class="form-control"
                    placeholder="Address"
                    type="text"
                    value="RomaniaBucharest"
                  />
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label">
                    <i class="tim-icons icon-world"></i> Country
                  </label>
                  <input
                    class="form-control"
                    placeholder="Country"
                    type="text"
                    value="Romania"
                  />
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label">
                    <i class="tim-icons icon-bulb-63"></i> Postal Code
                  </label>
                  <input
                    class="form-control"
                    placeholder="Postal Code"
                    type="text"
                    value="011111"
                  />
                </div>
              </div>
            </div>

            <!-- À propos -->
            <div class="form-group">
              <label class="form-label">
                <i class="tim-icons icon-notes"></i> À propos de moi
              </label>
              <textarea
                class="form-control"
                placeholder="Décrivez-vous..."
                rows="4"
              >
Je suis un développeur passionné avec plus de 5 ans d'expérience dans le développement web.
              </textarea>
            </div>
          </form>
        </div>
        <div class="card-footer">
          <div class="button-group">
            <button class="btn btn-secondary" type="button">
              <i class="tim-icons icon-simple-remove"></i> Cancel
            </button>
            <button class="btn btn-primary" type="submit">
              <i class="tim-icons icon-check-2"></i> Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Sidebar Profil -->
    <div class="col-lg-4">
      <!-- Carte Avatar -->
      <div class="card avatar-card">
        <div class="card-body">
          <div class="avatar-wrapper">
            <img alt="Avatar" class="profile-avatar" src="assets/img/emilyz.jpg" />
            <div class="avatar-status">
              <span class="status-badge online"></span>
              <span class="status-text">Online</span>
            </div>
          </div>
          <h4 class="profile-name">Mike Andrew</h4>
          <p class="profile-role">CEO/Co-Founder</p>
          <div class="profile-badges">
            <span class="badge badge-primary">Administrator</span>
            <span class="badge badge-success">Verified</span>
          </div>
        </div>
      </div>

      <!-- Statistiques -->
      <div class="card stats-card">
        <div class="card-header">
          <h5 class="card-title">📊 Statistics</h5>
        </div>
        <div class="card-body">
          <div class="stat-item">
            <span class="stat-label">Events Created</span>
            <span class="stat-value">12</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Users Managed</span>
            <span class="stat-value">45</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Registrations Processed</span>
            <span class="stat-value">128</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Member Since</span>
            <span class="stat-value">2022</span>
          </div>
        </div>
      </div>

      <!-- Réseaux Sociaux -->
      <div class="card social-card">
        <div class="card-header">
          <h5 class="card-title">🔗 Social Networks</h5>
        </div>
        <div class="card-body">
          <div class="social-buttons">
            <button class="btn btn-social facebook" title="Facebook">
              <i class="fab fa-facebook-f"></i>
            </button>
            <button class="btn btn-social twitter" title="Twitter">
              <i class="fab fa-twitter"></i>
            </button>
            <button class="btn btn-social linkedin" title="LinkedIn">
              <i class="fab fa-linkedin-in"></i>
            </button>
            <button class="btn btn-social github" title="GitHub">
              <i class="fab fa-github"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
