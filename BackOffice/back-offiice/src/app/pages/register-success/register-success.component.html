<div class="wrapper">
  <div class="main-panel" style="width: 100%; display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="content text-center" style="padding: 40px;">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card card-plain">
            <div class="card-body">

              <!-- Icône succès -->
              <div class="success-icon">
                <i class="tim-icons icon-check-2"></i>
              </div>

              <h1 class="title" style="margin-top: 20px; color: #ffffff;">
                Inscription réussie !
              </h1>

              <p class="description" style="font-size: 1.1em; color: #9A9A9A; margin-bottom: 10px;">
                <span *ngIf="userName">Bienvenue <strong style="color: #e14eca;">{{ userName }}</strong> !</span>
                <span *ngIf="!userName">Bienvenue !</span>
              </p>

              <p class="description" style="font-size: 1em; color: #9A9A9A; margin-bottom: 30px;">
                Votre compte participant a été créé avec succès.<br/>
                Vous pouvez maintenant accéder à l'application d'événements.
              </p>

              <div class="success-info" style="background: rgba(225, 78, 202, 0.1); border: 1px solid rgba(225, 78, 202, 0.3); border-radius: 10px; padding: 20px; margin-bottom: 30px;">
                <i class="tim-icons icon-badge" style="color: #e14eca; font-size: 24px; margin-bottom: 10px;"></i>
                <p style="color: #cccccc; margin: 0; font-size: 0.95em;">
                  Rôle assigné : <strong style="color: #e14eca;">Participant</strong><br/>
                  <span *ngIf="userEmail" style="font-size: 0.85em; color: #9A9A9A;">{{ userEmail }}</span>
                </p>
              </div>

              <button class="btn btn-round" style="background: #e14eca; border: none;" (click)="logout()">
                <i class="tim-icons icon-button-power"></i> Se déconnecter
              </button>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
