<div class="sidebar-header">
  <button class="sidebar-toggle-btn" (click)="toggleSidebar()" title="Masquer le menu">
    <i class="tim-icons icon-minimal-left"></i>
  </button>
  <div class="logo">
    <a href="#" class="simple-text logo-normal">
      <img src="assets/img/logo-linsoft.png" alt="LinSoft" style="height:42px; object-fit:contain; max-width:160px;" />
    </a>
  </div>
</div>
<div class="sidebar-wrapper">
  <ul class="nav">
    <li
      routerLinkActive="active"
      *ngFor="let menuItem of menuItems"
      class="{{ menuItem.class }} nav-item"
    >
      <a [routerLink]="[menuItem.path]">
        <i class="tim-icons  {{ menuItem.icon }}"></i>
        <p>{{ menuItem.title }}</p>
      </a>
    </li>
  </ul>

  <!-- Bouton Déconnexion -->
  <div class="logout-wrapper">
    <button
      (click)="logout()"
      class="btn-logout"
    >
      <i class="tim-icons icon-bullet-list-67"></i> Déconnexion
    </button>
  </div>
</div>
