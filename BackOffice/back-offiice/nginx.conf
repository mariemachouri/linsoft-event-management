# Config nginx du BackOffice
# - sert la SPA Angular (routage par hash → index.html suffit)
# - proxifie /api vers la gateway INTERNE → aucun problème de CORS
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Retire l'en-tête Origin : le proxy est interne, le CORS de la gateway ne doit pas s'appliquer
        proxy_set_header Origin "";
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
